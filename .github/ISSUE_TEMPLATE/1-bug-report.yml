name: Bug report
description: Create a report to help improve NvColorProfiles
labels: ["bug"]
title: "[Bug]: "
body:
  - type: checkboxes
    id: pre-check
    attributes:
      label: Pre-check
      description: "You must confirm **all** of the following before you can submit this report."
      options:
        - label: I have read the [Bug Reporting Guidelines](https://github.com/0skater0/NvColorProfiles#reporting-bugs).
          required: true
        - label: I have searched the [existing issues](https://github.com/0skater0/NvColorProfiles/issues) and this bug has not been reported yet.
          required: true
        - label: I am on an NVIDIA GPU with current drivers.
          required: true
  - type: textarea
    id: describe-the-bug
    attributes:
      label: Describe the bug
      description: "A clear and concise description of what the bug is."
      placeholder: "Describe the issue"
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce
      description: "Steps to reproduce the behavior."
      placeholder: |
        1. Open Settings
        2. Create a profile and set vibrance to 70%
        3. Add a rule for game.exe
        4. Right-click the tray icon and enable "Automatic (rules)"
        5. Start the game and see ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: "A clear and concise description of what you expected to happen."
      placeholder: "The behavior that I expect to see is [...]"
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does this occur?
      options:
        - Always
        - Sometimes
        - Rarely
        - Once
      default: 0
    validations:
      required: true
  - type: textarea
    id: diagnostic-bundle
    attributes:
      label: Diagnostic Bundle
      description: |
        **Required unless the app cannot start.** Open the app → Settings → General → **Export Diagnostic Bundle**. A `.zip` is written to your Downloads folder. **Drag & drop the .zip from Windows Explorer into this text field**; GitHub uploads it and inserts a link.

        The bundle already contains your app version, NVIDIA driver, GPU model, Windows version, monitor models, HDR state, ICC profile, NVIDIA Control Panel color state, other color-related tools currently running, the full app log, and your config — so you do not have to fill any of that in by hand.

        What goes into the bundle and what is redacted before it is written is documented in [PRIVACY.md](https://github.com/0skater0/NvColorProfiles/blob/main/docs/PRIVACY.md). The zip is a plain file on your disk — you can open and inspect it before uploading.
      placeholder: "Drop the .zip here"
    validations:
      required: false
  - type: checkboxes
    id: bundle-unavailable
    attributes:
      label: Bundle unavailable
      options:
        - label: "App does not start (cannot generate a bundle) — describe the crash in Additional context below"
          required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: "Anything else worth knowing that isn't in the bundle. Screenshots, videos, notes on your monitor setup, other tools you have tried, and — if the app doesn't start — how exactly it fails."
      placeholder: "Also note that [...]"
    validations:
      required: false
